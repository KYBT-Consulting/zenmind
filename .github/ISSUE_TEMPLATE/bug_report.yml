name: '🐛 Bug Report'
description: Report a reproducible problem or unexpected behavior in ZenMind
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues first to avoid duplicates.
  - type: input
    id: version
    attributes:
      label: ZenMind Version / Environment
      description: What version of ZenMind are you using? (e.g. Web Demo, Desktop Linux .AppImage, Windows .msi)
      placeholder: e.g. Web demo on Chrome 124 / Linux Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Open ZenMind
        2. Insert a topic
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, console logs, or exported `.zenmind` files to help diagnose the issue.
