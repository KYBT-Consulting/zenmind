name: Bug Report
description: Report a bug, crash, or unexpected behavior in ZenMind
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in **ZenMind**!
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe what went wrong...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open ZenMind and click '...'
        2. Select topic '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Runtime Environment
      options:
        - Web Browser (Vite / Hosted)
        - Windows Desktop (.msi / .exe)
        - macOS Desktop (.dmg / .app)
        - Linux Desktop (.AppImage / .deb)
    validations:
      required: true
  - type: input
    id: os_browser
    attributes:
      label: OS & Browser / Version
      placeholder: e.g. Windows 11, Chrome 131 / ZenMind v0.2.0
  - type: textarea
    id: logs
    attributes:
      label: Console Logs or Screenshots
      description: If applicable, paste any error message or attach a sample `.zenmind` file.
