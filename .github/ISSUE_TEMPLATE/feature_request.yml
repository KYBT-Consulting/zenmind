name: Feature Request
description: Suggest an idea, template, layout, or enhancement for ZenMind
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make **ZenMind** even better? Tell us about it below!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What workflow or problem would this feature solve?
      placeholder: I often need to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work in ZenMind?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Canvas & Layouts
        - Templates & Styling
        - Keyboard & Vim Navigation
        - Import / Export Formats
        - AI Brainstorming Assistant
        - Desktop App (Tauri)
        - Other
