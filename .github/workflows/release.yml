name: Release ZenMind Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: '--bundles deb,appimage,rpm'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies (Ubuntu 24.04)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libssl-dev rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ZenMind ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          args: ${{ matrix.args }}
          releaseBody: |
            ## ZenMind ${{ github.ref_name }} 🧘‍♂️

            Welcome to the official **ZenMind v0.1.0** desktop release! An open-source, modern EdrawMind alternative built for cross-platform mind mapping and diagramming with local and cloud AI copilot.

            ### 🌟 Key Highlights
            - **Interactive SVG Engine**: Dynamic layout trees, logic charts, timelines, fishbone diagrams, and free-floating topics with smooth drag-and-drop.
            - **Modern Office/EdrawMind Ribbon UI**: Intuitive tabs (Home, Insert, Page Style, View, AI), synchronized outline editor, format painter, and docked format inspector.
            - **Local & Cloud AI Copilot**: Native integrations for Google Gemini and custom OpenAI-compatible endpoints (Ollama, LM Studio, vLLM, OpenRouter).
            - **Task & Presentation Tools**: Todo checkboxes, progress tracking (0%-100%), priority badges (P1-P5), markdown notes drawer, and presentation mode.
            - **Multi-Format Interoperability**: Import and export PNG, crisp SVG, print PDF, XMind archives, OPML 2.0, FreeMind XML, and native `.zenmind` files.
            - **Cross-Platform Native Desktop**: Built on Tauri for fast startup, low RAM footprint (~40MB), and direct filesystem access (including standalone Windows Portable ZIP).

            ### 🌐 Live Web Demo
            - Try ZenMind online: [kybt-consulting.github.io/zenmind](https://kybt-consulting.github.io/zenmind/)

            ---
            Built with ❤️ by [KYBT Consulting](https://kybtconsulting.com) (makers of [Vertaxa EA](https://vertaxa.online)).

      - name: Package and Upload Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}"
          $portableDir = "ZenMind-${version}-windows-portable-x64"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null

          # Find compiled release executable
          $exePath = "src-tauri/target/release/zenmind.exe"
          if (-not (Test-Path $exePath)) {
            $exePath = (Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -Recurse | Where-Object { $_.Name -match "zenmind|ZenMind" } | Select-Object -First 1).FullName
          }

          Copy-Item $exePath -Destination "$portableDir/ZenMind.exe" -Force
          Copy-Item "README.md" -Destination "$portableDir/README.md" -Force
          Copy-Item "LICENSE" -Destination "$portableDir/LICENSE" -Force
          New-Item -ItemType Directory -Path "$portableDir/data" -Force | Out-Null
          New-Item -ItemType File -Path "$portableDir/.portable" -Force | Out-Null

          $zipName = "ZenMind-${version}-windows-x64-portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipName -Force
          Write-Host "Created portable archive: $zipName"

          if ($env:GITHUB_REF -like "refs/tags/*") {
            gh release upload $version $zipName --clobber
            Write-Host "Uploaded $zipName to GitHub release $version"
          }

      - name: Verify and Upload Linux RPM
        if: matrix.platform == 'ubuntu-24.04' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find src-tauri/target/release/bundle/rpm -name "*.rpm" -exec gh release upload ${{ github.ref_name }} {} --clobber \; || true


