name: Fedora 44 Container & RPM Package

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'Dockerfile*'
      - '.github/workflows/docker-fedora.yml'
  workflow_dispatch:

jobs:
  build-fedora44:
    name: Build Fedora 44 Image & RPM
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Fedora 44 Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fedora44
          load: true
          tags: zenmind:fedora44

      - name: Extract Fedora RPM & Bundles
        run: |
          mkdir -p output-fedora
          docker run --rm -v $(pwd)/output-fedora:/out zenmind:fedora44 cp -r /dist/. /out/
          echo "Generated Fedora packages:"
          ls -la output-fedora/

      - name: Upload Fedora RPM to Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find output-fedora/rpm -name "*.rpm" -exec gh release upload ${{ github.ref_name }} {} --clobber \; || true
